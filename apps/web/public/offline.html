<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8B1414" />
  <title>Offline — PejuangYen</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F7F7F8; color: #0D0D0D; padding: 24px; text-align: center;
    }
    .card { max-width: 360px; }
    .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 24px;
      background: #8B1414; display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 38px; height: 38px; stroke: #fff; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #475569; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
    button {
      appearance: none; border: 0; cursor: pointer; min-height: 48px; padding: 0 24px;
      border-radius: 12px; background: #8B1414; color: #fff; font-size: 15px; font-weight: 600;
      transition: transform .15s ease, background .15s ease;
    }
    button:active { transform: scale(0.97); background: #6E0F0F; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0" /><path d="M1.42 9a16 16 0 0 1 21.16 0" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>Kamu sedang offline</h1>
    <p>Sambungan internet terputus. Periksa koneksi lalu coba lagi — progres belajarmu aman.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
